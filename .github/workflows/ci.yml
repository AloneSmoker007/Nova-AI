name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, syntax check, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check JavaScript syntax
        shell: bash
        run: find src tests scripts web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      # Release gate: fail on known HIGH/CRITICAL vulnerabilities in dependencies
      # shipped to production. Development-only advisories are triaged separately.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migration chain against PostgreSQL 15
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # tests/migration-postgres.test.js maps MIGRATION_TEST_DATABASE_URL onto
    # DATABASE_URL before importing the migration runner, then applies the full
    # chain to a fresh database and re-runs it to prove the second run is a no-op.
    env:
      MIGRATION_TEST_DATABASE_URL: postgres://nova:nova@127.0.0.1:5432/nova_migration_test
      MIGRATION_TEST_ALLOW_RESET: "1"
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migration integration tests
        run: node --test tests/migration-postgres.test.js

      # TASK-01 regression coverage (A-5.15A-X-001): tenant resolver schema fix.
      # Kept as its own step so it runs after the migration suite in a separate
      # process; both suites reset the shared test database, and GitHub Actions
      # step serialization guarantees they cannot overlap.
      # Note: when running these locally with MIGRATION_TEST_ALLOW_RESET=1, run
      # one database suite file at a time for the same reason.
      - name: Run tenant resolver integration tests
        run: node --test tests/tenant-resolver.test.js

      # TASK-02 regression coverage: execute automation SQL against real PostgreSQL.
      # Keep this as a separate serialized step because the integration suite resets public schema.
      - name: Run automation SQL integration tests
        run: node --test tests/automation-postgres.test.js

      # External side effects require a durable result ledger. This live-PG suite
      # proves success replay skips duplicate POSTs and ambiguous outcomes are
      # parked until an owner/admin records a manual reconciliation decision.
      - name: Run automation webhook effect integration tests
        run: node --test tests/automation-webhook-effects.test.js

      # TASK-03 regression coverage: per-tenant payment webhook authentication,
      # tested against the real application and PostgreSQL. This suite resets
      # the shared test schema, so it runs as a separate serialized step.
      - name: Run payment webhook tenant-isolation integration tests
        run: timeout 120s node --test tests/payment-webhook-tenant-isolation.test.js

      # TASK-04 regression coverage: outbound WhatsApp delivery retries,
      # attempt caps, lease fencing and monotonic state transitions.
      # Run in its own serialized step because the suite resets public schema.
      - name: Run WhatsApp delivery reliability integration tests
        run: node --test tests/delivery-reliability.test.js

      # TASK-07 regression coverage: message-scoped AI signal idempotency.
      # This suite also resets public schema, so keep it serialized.
      - name: Run AI signal idempotency integration tests
        run: node --test tests/ai-signal-idempotency.test.js

      # TASK-08 regression coverage: only the current automation executor may
      # advance a run; this integration suite resets public schema too.
      - name: Run automation executor fencing integration tests
        run: node --test tests/automation-executor-fencing.test.js

      # TASK-23 regression coverage: buffered appointment occupancy and concurrent overlap enforcement.
      # This suite resets public schema; keep it serialized and last in this job.
      - name: Run appointment buffer integration tests
        run: node --test tests/appointment-buffer.test.js

      # TASK-25 regression coverage: expired token replay and refresh-token retention.
      # The test resets public schema, so run it serialized and last in this job.
      - name: Run refresh token replay integration tests
        run: node --test tests/refresh-token-replay.test.js

      # Final-gate auth regression: issued access JWTs must fail after logout,
      # role change, password change, and refresh-token reuse.
      - name: Run access-token revocation integration tests
        run: node --test tests/access-token-revocation.test.js

      # Real composed HTTP app + two synthetic tenants and three DB-backed
      # roles. This suite resets public schema; keep it serialized like the
      # other integration files. External provider calls are forbidden.
      - name: Run HTTP tenant and role authorization matrix
        run: timeout 120s node --test tests/api-tenant-http.test.js

      # Real ingress/dispatcher/worker/database/Redis with SDK-level model and
      # Meta HTTP transport substitutes. This is not live provider evidence.
      - name: Run AI output to outbound delivery boundary integration tests
        run: timeout 120s node --test tests/ai-outbound-boundary.test.js

      # Privacy regression: deleted customer messages must not be copied into
      # future handoff summaries or persisted AI summary context.
      - name: Run deleted-message handoff privacy integration tests
        run: node --test tests/handoff-deleted-message.test.js

      # TASK-27/TASK-29/TASK-30 coverage: canonical inbound IDs, post-retention replay,
      # and monotonic activity timestamps. This suite resets public schema; keep it serialized
      # before the final inbox lease-recovery integration suite.
      - name: Run inbound message persistence integration tests
        run: node --test tests/inbound-message-persistence.test.js

      # TASK-28 regression coverage: prevent inbox recovery from clearing a lease renewed by a live worker.
      # This suite resets public schema; keep it serialized before the final dead-letter operations suite.
      - name: Run webhook inbox recovery integration tests
        run: node --test tests/webhook-inbox-recovery.test.js

      # TASK-34 regression coverage: tenant-scoped dead-letter listing and audited manual retry.
      # This suite also resets public schema, so run it serialized and last in this job.
      - name: Run webhook dead-letter operations integration tests
        run: node --test tests/webhook-dead-letter-operations.test.js

      # Final-gate usage regression: enforce reservation ownership, stale-worker
      # fencing, and cleanup when an AI operation reaches dead letter without output.
      - name: Run AI reservation fencing integration tests
        run: node --test tests/usage-reservation-fencing.test.js

      # Final-gate Redis check: prove BullMQ terminal job IDs can be re-enqueued
      # against a live Redis service rather than a deterministic queue double.
      - name: Run live Redis and BullMQ re-enqueue integration test
        run: node --test tests/bullmq-redis-integration.test.js

      # N-13 regression: prove real-app test startup/teardown exits naturally
      # even with BOTH the PostgreSQL pool and BullMQ Redis worker enabled.
      - name: Verify Task 16 natural exit with PostgreSQL and Redis
        env:
          DATABASE_URL: postgres://nova:nova@127.0.0.1:5432/nova_migration_test
        run: timeout 120s node --test tests/task16-route-behavior.test.js

      # Part 5.15-B backup/restore gate: create two disposable databases on
      # the local PostgreSQL 15 service, verify encrypted backup and restore,
      # reject wrong keys and tampering, then drop both test databases.
      # Use the exact PostgreSQL 15 utilities already installed in our
      # throwaway service container. Newer pg_dump (for example PG18) can emit
      # settings that PostgreSQL 15 cannot restore.
      - name: Use PostgreSQL 15 client utilities for backup smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pg15-client"
          for utility in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/pg15-client/$utility" <<'PG_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i \
            -e "PGHOST=127.0.0.1" \
            -e "PGPORT=5432" \
            -e "PGUSER=${PGUSER}" \
            -e "PGPASSWORD=${PGPASSWORD}" \
            -e "PGDATABASE=${PGDATABASE}" \
            "${TEST_POSTGRES_CONTAINER}" "${0##*/}" "$@"
          PG_WRAPPER
            chmod +x "$RUNNER_TEMP/pg15-client/$utility"
          done
          echo "$RUNNER_TEMP/pg15-client" >> "$GITHUB_PATH"

      - name: Verify encrypted backup and restore on throwaway databases
        env:
          NOVA_BACKUP_TEST_ALLOW_CREATE_DATABASES: "YES"
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: timeout 180s node --test tests/backup-restore-roundtrip.test.js
