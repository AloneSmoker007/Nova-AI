name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_ai_test
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nova:nova_test_password@localhost:5432/nova_ai_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      JWT_ISSUER: nova-ai
      JWT_AUDIENCE: nova-ai-api
      GEMINI_API_KEY: test-key
      WEBHOOK_VERIFY_TOKEN: test-token
      META_APP_SECRET: test-secret
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Syntax check JS files
        run: find src -name "*.js" -exec node --check {} \;

      - name: Run unit tests
        run: npm test -- --coverage --ci

      - name: Upload coverage reports to Codecov or artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
