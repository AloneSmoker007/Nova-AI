<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI — Sign in</title><link rel="stylesheet" href="./styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="panel" style="width:min(430px,100%);padding:30px"><div class="brand"><div class="brand-mark">N</div><div><strong>Nova</strong><span>AI Workspace</span></div></div><p class="eyebrow">SECURE ACCESS</p><h1 style="margin:0 0 8px">Welcome back</h1><p class="muted">Sign in to your tenant workspace.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="email" style="width:100%;margin:7px 0 14px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password" style="width:100%;margin:7px 0 14px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)"></label><button class="primary" type="submit">Sign in</button><p id="error" class="muted" role="alert"></p></form></section></main><script src="./api.js"></script><script>document.querySelector("#login-form").addEventListener("submit",async e=>{e.preventDefault();const error=document.querySelector("#error");error.textContent="";try{await NovaAPI.login(document.querySelector("#email").value,document.querySelector("#password").value);location.href="./index.html"}catch(err){error.textContent=err.message||"Sign in failed"}});</script></body></html>
